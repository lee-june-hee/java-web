<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나피리 상세</title>

    <!-- Bootstrap 5 CSS (index.html과 동일하게 연동) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- LOL 스타일 맞추기 위한 간단 커스텀 (필요 시 resources/css/custom.css로 이동) -->
    <style>
        body {
            background-color: #0a0e17;
            color: white;
            padding: 1.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        h3,
        h4 {
            color: #c8aa6e;
            /* LOL 골드 톤 */
        }

        .text-muted {
            color: #a0a0a0 !important;
        }

        .list-group-item {
            background: transparent;
            border-color: #444;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row g-4">

            <!-- 왼쪽: 이미지 + 기본 정보 -->
            <div class="col-lg-5 text-center">
                <img src="../image/Naafiri images.jpg" class="img-fluid rounded shadow-lg" alt="아트록스"
                    style="max-height: 480px; object-fit: contain;">
                <div class="mt-3">
                    <h3 class="mb-1">나피리 (Naafiri)</h3>
                    <p class="text-muted fs-5">암살자 / 난이도: 하</p>
                </div>
            </div>

            <!-- 오른쪽: 스킬 + 스토리 -->
            <div class="col-lg-7">
                <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item">패시브: 늘어나는 무리</li>
                    <li class="list-group-item">Q: 다르킨 단검</li>
                    <li class="list-group-item">W: 무리의 부름</li>
                    <li class="list-group-item">E: 적출</li>
                    <li class="list-group-item">R: 사냥개의 추적</li>
                </ul>

                <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
                <p class="text-secondary lh-lg">
                    오늘도 슈리마 사막에는 우렁찬 포효가 합창곡처럼 울려 퍼진다. 
                    게걸스러운 포식자인 모래 언덕의 사냥개들이 이 황량한 땅에서 무리지어 
                    사냥할 권리를 두고 싸우며 울부짖는 소리다. 그중 정점에 오른 무리가 있다.
                    사냥개의 본능이 아니라, 고대 다르킨의 힘을 품고 움직이는 무리 말이다.
                </p>
            </div>

        </div>
    </div>

</body>

</html>
